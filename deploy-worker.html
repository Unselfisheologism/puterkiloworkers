<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deploy Puter Worker</title>
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <button id="signIn">Sign In to Puter</button>
    <button id="deploy" disabled>Deploy Worker</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');
        const signInBtn = document.getElementById('signIn');
        const deployBtn = document.getElementById('deploy');

        function log(msg) {
            output.textContent += msg + '\n';
        }

        signInBtn.addEventListener('click', async () => {
            try {
                log('Initiating sign-in...');
                const res = await puter.auth.signIn();
                if (res) {
                    log('Signed in successfully!');
                    
                    // Check for verified email (common cause of perms issues)
                    const user = await puter.user.get();
                    if (!user.emailVerified) {
                        log('WARNING: Email not verified! Verify at puter.com to enable Workers/FS.');
                    }
                    
                    signInBtn.disabled = true;
                    deployBtn.disabled = false;
                }
            } catch (err) {
                log('Sign-in failed: ' + err.message);
            }
        });

        deployBtn.addEventListener('click', async () => {
            try {
                log('Starting deployment...');

                // Request FS write permission if not granted
                log('Requesting storage write permission...');
                const permGranted = await puter.perms.request('PERM_WRITE_STORAGE');
                if (!permGranted) {
                    throw new Error('Storage write permission denied by user.');
                }
                log('Permission granted.');

                // Read the worker code from worker.js file
                log('Fetching worker.js...');
                const response = await fetch('worker.js');
                const workerCode = await response.text();

                // Write directly to root FS path (auto-creates dirs if needed)
                const filePath = '/worker.js';
                log(`Writing worker code to ${filePath}...`);
                await puter.fs.write(filePath, workerCode);
                log('Worker code uploaded successfully.');

                // Deploy the worker using name and filePath
                const workerName = 'my-claude-agent';  // Change if desired; must be unique
                log(`Creating worker "${workerName}"...`);
                const worker = await puter.workers.create(workerName, filePath);

                // Wait for propagation (5-30s)
                log('Deployment successful! Waiting 5s for propagation...');
                await new Promise(resolve => setTimeout(resolve, 5000));

                const apiUrl = `https://${workerName}.puter.work/v1/chat/completions`;
                log(`Worker deployed! Access your OpenAI-compatible API at: ${apiUrl}`);
                log(`Full worker info: ${JSON.stringify(worker, null, 2)}`);
                
                // Quick test
                log('Testing endpoint...');
                try {
                    const testRes = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer abcdefg',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'gpt-4',
                            messages: [{ role: 'user', content: 'Say hello from Claude!' }],
                            stream: false
                        })
                    });
                    const testData = await testRes.json();
                    log(`Test response: ${JSON.stringify(testData, null, 2)}`);
                } catch (testErr) {
                    log(`Test failed (normal if still propagating): ${testErr.message}`);
                }
            } catch (err) {
                log('Deployment failed: ' + err.message);
                // Distinguish FS vs. worker errors
                if (err.message.includes('fs') || err.message.includes('storage')) {
                    log('Tip: Ensure email is verified and grant FS permissions.');
                } else if (err.message.includes('worker')) {
                    log('Tip: Worker name may be taken; try a unique one like "my-claude-' + Date.now() + '".');
                }
            }
        });
    </script>
</body>
</html>
